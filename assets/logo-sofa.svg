<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="46" height="46">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="50%" stop-color="#fda085"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Shield Background -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#shieldGrad)" filter="url(#shadow)"/>
  <rect x="3.5" y="3.5" width="41" height="41" rx="8.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8"/>

  <!-- Crown / Premium Craftsmanship Icon -->
  <path d="M19 12 L24 9 L29 12 L27.5 14.5 L24 13 L20.5 14.5 Z" fill="url(#goldGrad)"/>

  <!-- Sofa Backrest -->
  <rect x="12" y="16" width="24" height="11" rx="3" fill="#ffffff"/>
  <line x1="24" y1="17" x2="24" y2="26" stroke="#c0392b" stroke-width="1" stroke-dasharray="1 1"/>

  <!-- Sofa Armrests -->
  <rect x="9" y="21" width="4.5" height="11" rx="2.2" fill="url(#goldGrad)"/>
  <rect x="34.5" y="21" width="4.5" height="11" rx="2.2" fill="url(#goldGrad)"/>

  <!-- Sofa Cushion Seat -->
  <rect x="11.5" y="25" width="25" height="7.5" rx="2" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="0.8"/>

  <!-- Wooden Feet Legs -->
  <polygon points="12,32.5 14,32.5 12.5,37 10.5,37" fill="url(#goldGrad)"/>
  <polygon points="36,32.5 34,32.5 35.5,37 37.5,37" fill="url(#goldGrad)"/>
</svg>
